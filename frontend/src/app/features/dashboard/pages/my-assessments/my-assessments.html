<div class="page">
  <div class="page-header">
    <div>
      <h2 class="page-title">Minhas Avaliações</h2>
      <p class="page-subtitle">Acompanhe as avaliações de bem-estar atribuídas a você</p>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="items()" class="full-table">

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Avaliação</th>
          <td mat-cell *matCellDef="let row"><strong>{{ row.title }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Situação</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-chip" [class]="row.status">{{ statusLabel(row.status) }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button mat-flat-button color="primary" class="compact-btn"
                    [disabled]="row.status === 'completed'"
                    [routerLink]="row.status !== 'completed' ? ['/dashboard/forms/view', row.id] : null">
              {{ actionLabel(row.status) }}
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
