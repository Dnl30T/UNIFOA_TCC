spring.application.name=unformulieren
spring.profiles.active=dev

# ── Relational Database (PostgreSQL) ─────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unformulieren}
spring.datasource.username=${DB_USER:unformulieren}
spring.datasource.password=${DB_PASSWORD:unformulieren}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (PostgreSQL migrations only)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Wide-Column Store (ScyllaDB / Cassandra) ──────────────────────────────────
spring.cassandra.contact-points=${SCYLLA_HOST:localhost}
spring.cassandra.port=${SCYLLA_PORT:9042}
spring.cassandra.keyspace-name=${SCYLLA_KEYSPACE:psytrack}
spring.cassandra.local-datacenter=${SCYLLA_DATACENTER:datacenter1}
# Schema is bootstrapped by ScyllaDbConfig (CREATE KEYSPACE) + schema.cql via
# the Docker scylladb-init service. The manual CqlSession bean does not use
# Spring Boot's schema-action property.

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-prod-min32chars}
app.jwt.expiration-ms=86400000

# ── Azure Blob Storage (Azurite locally) ─────────────────────────────────────
# Azurite well-known dev credentials; override with real connection string in prod.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:profile-pictures}
